<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d2733" />
    <meta name="description" content="AxisBuilder - AUT scan coverage drawings for pressure vessels and tanks" />
    <title>AxisBuilder</title>
    <script>
      // The theme before the first paint (same key and rule as src/ui/theme.ts), so a dark screen never flashes white.
      ;(function () {
        var c = 'auto'
        try {
          c = localStorage.getItem('axisbuilder:theme') || 'auto'
        } catch (e) {}
        var dark = c === 'dark' || (c !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        var t = dark ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', t)
        document.documentElement.style.colorScheme = t
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
